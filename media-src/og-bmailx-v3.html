<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#000;color:#f4f1e8;font-family:'IBM Plex Sans';position:relative;overflow:hidden}
body::before{content:"";position:absolute;right:-120px;top:40px;width:720px;height:620px;background:radial-gradient(closest-side,rgba(245,184,0,.22),transparent 70%)}
.logo{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:14px;font:700 34px/1 'Space Grotesk';letter-spacing:-.02em}
.g{color:#ffd24d}
h1{position:absolute;left:72px;top:170px;margin:0;font:700 112px/.95 'Space Grotesk';letter-spacing:-.05em}
h1 span{background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#c98f00);-webkit-background-clip:text;color:transparent}
p{position:absolute;left:72px;top:410px;margin:0;width:560px;font:400 28px/1.35 'IBM Plex Sans';color:#cfcabd}
.foot{position:absolute;left:72px;bottom:52px;font:500 22px/1 'Space Grotesk';color:#7c7a73}
.foot b{color:#f4f1e8;font-weight:500}
.card{position:absolute;right:80px;top:120px;width:380px;height:400px;transform:rotate(4deg)}
.env{position:absolute;inset:auto 0 0 0;height:230px;background:#15161a;border:1px solid #2a2c33;border-radius:16px}
.letter{position:absolute;left:24px;right:24px;bottom:92px;height:300px;background:#f6f1e3;border-radius:12px;padding:22px;color:#17150f}
.from{font:600 18px/1 'Space Grotesk';color:#5d5546}
.ln{height:9px;border-radius:5px;background:#ddd5c2;margin-top:14px}
.paid{position:absolute;left:22px;right:22px;top:118px;display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #cbbf9f;padding-top:14px;font:600 20px/1 'Space Grotesk'}
.paid b{font-size:34px;color:#8a6300}
.front{position:absolute;inset:auto 0 0 0;height:230px;background:linear-gradient(160deg,#1e1f24,#101114);border-radius:0 0 16px 16px;clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%);border:1px solid #2a2c33}
.front i{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:500 22px/1 'Space Grotesk';color:#a9a69c;font-style:normal}
.stamp{position:absolute;right:-40px;top:250px;width:104px;height:124px;transform:rotate(8deg)}
.pill{position:absolute;left:-40px;top:-46px;font:700 22px/1 'Space Grotesk';color:#000;background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#c98f00);border-radius:999px;padding:13px 18px;box-shadow:0 10px 30px -8px rgba(245,184,0,.8)}
</style></head><body>
<div class="logo"><img src="../logo.svg" width="30" height="40"><span>bMail<span class="g">X</span></span></div>
<h1>Email<br>that <span>pays.</span></h1>
<p>Sealed letters that carry money. Set a price to reach you; friends write free.</p>
<div class="foot"><b>bmailx.com</b> · Live in bWalletX</div>
<div class="card">
  <div class="env"></div>
  <div class="letter"><div class="from">From $alice · sealed for you</div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div>
  <div class="paid"><span>Stamp paid to you</span><b>1¢</b></div></div>
  <div class="front"><i>you@bmailx.com</i></div>
  <svg class="stamp" viewBox="0 0 84 100"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".6" stop-color="#ffd24d"/><stop offset="1" stop-color="#c98f00"/></linearGradient></defs><rect x="2" y="2" width="80" height="96" rx="4" fill="url(#s)" stroke="#000" stroke-width="3" stroke-dasharray="4 4"/><rect x="10" y="10" width="64" height="80" rx="2" fill="none" stroke="#000" stroke-opacity=".35"/><text x="42" y="56" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="30">1¢</text><text x="42" y="78" text-anchor="middle" font-family="Space Grotesk" font-weight="600" font-size="9.5" letter-spacing="1.4">PENNY POST</text></svg>
  <div class="pill">+1¢ received</div>
</div>
</body></html>
